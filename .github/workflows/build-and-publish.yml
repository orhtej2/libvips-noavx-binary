name: Build and Publish libvips Binaries

'on':
   schedule:
     - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: Force build even if the repo tag already exists
        required: false
        default: false
        type: boolean
      release_tag:
        description: Specific libvips tag to build (leave empty for latest)
        required: false
        type: string

jobs:
  check-and-build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.check-release.outputs.should_build }}
      release_tag: ${{ steps.check-release.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for new libvips release
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ github.event.inputs.force_build || 'false' }}
          MANUAL_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euxo pipefail

          echo "should_build=false" >> "$GITHUB_OUTPUT"

          RELEASE_TAG=""
          if [ -n "$MANUAL_TAG" ]; then
            RELEASE_TAG="$MANUAL_TAG"
            echo "Using manually specified release: $RELEASE_TAG"
          else
            for attempt in 1 2 3; do
              if RELEASE_TAG="$(gh api repos/libvips/libvips/releases/latest --jq '.tag_name' 2>/tmp/gh_latest_release.err || true)" && [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "null" ]; then
                break
              fi
              echo "Failed to resolve latest libvips release on attempt $attempt; retrying..."
              if [ "$attempt" -eq 3 ]; then
                echo "Unable to determine latest upstream libvips tag after 3 attempts"
                exit 0
              fi
              sleep 5
            done
          fi

          if [ -z "$RELEASE_TAG" ] || [ "$RELEASE_TAG" = "null" ]; then
            echo "Invalid release tag resolved: ${RELEASE_TAG:-<empty>}"
            exit 0
          fi

          echo "Latest libvips release: $RELEASE_TAG"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists in this repo"
            if [ "$FORCE_BUILD" != "true" ]; then
              for asset_attempt in 1 2 3; do
                if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' >/tmp/release-assets.txt 2>/tmp/gh_release_assets.err; then
                  ASSET="libvips-${RELEASE_TAG}-linux-amd64.tar.gz"
                  if grep -Fxq "$ASSET" /tmp/release-assets.txt; then
                    echo "amd64 asset already exists for $RELEASE_TAG"
                  else
                    echo "amd64 asset missing from $RELEASE_TAG; rebuilding it"
                    echo "should_build=true" >> "$GITHUB_OUTPUT"
                  fi
                  exit 0
                fi

                echo "Failed to fetch release assets for $RELEASE_TAG on attempt $asset_attempt; retrying..."
                if [ "$asset_attempt" -eq 3 ]; then
                  echo "Unable to confirm release asset state for $RELEASE_TAG after 3 attempts; bailing out"
                  exit 0
                fi
                sleep 5
              done
            fi
          fi

          echo "should_build=true" >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: check-and-build
    if: needs.check-and-build.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (for libimagequant/cargo-c)
        uses: dtolnay/rust-toolchain@stable

      - name: Build libvips for amd64 (x86_64-v1)
        run: |
          set -euxo pipefail
          chmod +x ./build.sh
          ./build.sh "${{ needs.check-and-build.outputs.release_tag }}"

      - name: Validate amd64 artifact
        run: |
          set -euxo pipefail
          archive="build/libvips-${{ needs.check-and-build.outputs.release_tag }}-linux-amd64.tar.gz"
          test -f "$archive"
          ls -lh "$archive"

      - name: Upload amd64 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libvips-amd64
          path: build/libvips-${{ needs.check-and-build.outputs.release_tag }}-linux-amd64.tar.gz
          retention-days: 30

  publish:
    needs: [check-and-build, build-amd64]
    if: always() && needs.check-and-build.outputs.should_build == 'true' && needs.build-amd64.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download amd64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libvips-amd64
          path: /tmp/artifacts/amd64

      - name: Generate release BOM from dependencies.lock
        run: |
          set -euxo pipefail

          RELEASE_TAG="${{ needs.check-and-build.outputs.release_tag }}"
          BOM_FILE="/tmp/artifacts/libvips-${RELEASE_TAG}-dependencies.bom.txt"

          # shellcheck source=/dev/null
          source ./dependencies.lock

          {
            echo "libvips ${RELEASE_TAG} - dependency bill of materials"
            echo "Generated $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            for var_name in ZLIB LIBDEFLATE LIBJPEG_TURBO LIBPNG LIBWEBP LIBTIFF LCMS2 \
                             CGIF LIBEXIF FFTW ORC HIGHWAY OPENJPEG LIBDE265 LIBHEIF \
                             LIBIMAGEQUANT LIBARCHIVE PCRE2 LIBFFI GLIB MESON; do
              repo_var="${var_name}_REPO"
              tag_var="${var_name}_TAG"
              echo "${var_name}: ${!repo_var} @ ${!tag_var}"
            done
          } > "$BOM_FILE"

          cat "$BOM_FILE"

      - name: Create GitHub release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          RELEASE_TAG="${{ needs.check-and-build.outputs.release_tag }}"

          if ! git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git tag "$RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" /tmp/artifacts/amd64/*.tar.gz /tmp/artifacts/*.bom.txt --clobber
          else
            gh release create "$RELEASE_TAG" \
              /tmp/artifacts/amd64/*.tar.gz /tmp/artifacts/*.bom.txt \
              --title "libvips $RELEASE_TAG (x86_64-v1)" \
              --notes "Prebuilt libvips $RELEASE_TAG for x86_64-v1 baseline."
          fi
